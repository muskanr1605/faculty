<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty | Faculty Management System</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Faculty Management</h2>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="faculty.html" class="active">Faculty</a>
                <a href="#">Departments</a>
                <a href="#">Subjects</a>
              <a href="../index.html">Logout</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">
                <h1>Faculty Management</h1>

                <div class="admin">
                    👤 Admin
                </div>
            </header>


            <!-- Faculty Header -->
            <section class="welcome">

                <div class="faculty-header">

                    <div>
                        <h2>Faculty Members</h2>
                        <p>Manage all faculty members of the institution.</p>
                    </div>

                   <button class="add-btn" id="addFacultyBtn" type="button">
    + Add Faculty
</button>

                </div>

            </section>


            <!-- Search -->
            <section class="search-section">

                <input
                    type="text"
                    id="facultySearch"
                    placeholder="Search faculty by name..."
                >

            </section>


<!-- Add Faculty Form -->
<section id="facultyFormSection" class="welcome" style="display: none; margin-bottom: 20px;">
    <h2>Add New Faculty</h2>

    <form id="facultyForm">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin-top: 20px;">

            <div>
                <label for="facultyCode">Faculty Code *</label>
                <input type="text" id="facultyCode" required placeholder="e.g. FAC005">
            </div>

            <div>
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" required placeholder="Enter first name">
            </div>

            <div>
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" required placeholder="Enter last name">
            </div>

            <div>
                <label for="email">Email *</label>
                <input type="email" id="email" required placeholder="Enter email">
            </div>

            <div>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="Enter phone number">
            </div>

            <div>
                <label for="designation">Designation</label>
                <input type="text" id="designation" placeholder="e.g. Assistant Professor">
            </div>

            <div>
                <label for="qualification">Qualification</label>
                <input type="text" id="qualification" placeholder="e.g. M.Tech">
            </div>

            <div>
                <label for="experience">Experience (Years)</label>
                <input type="number" id="experience" min="0" placeholder="e.g. 5">
            </div>

            <div>
                <label for="departmentId">Department ID *</label>
                <input type="number" id="departmentId" min="1" required placeholder="Enter department ID">
            </div>

        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="add-btn">Save Faculty</button>
            <button type="button" id="cancelFacultyBtn" class="delete-btn">Cancel</button>
        </div>

        <p id="facultyFormMessage" role="status" style="margin-top: 12px;"></p>
    </form>
</section>


            <!-- Faculty Table -->
            <section class="table-section">

                <table>

                    <thead>
                        <tr>
                            <th>Faculty Code</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Designation</th>
                            <th>Experience</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                   
<tbody id="facultyTableBody">
    <tr>
        <td colspan="6">Loading faculty data...</td>
    </tr>
</tbody>



                </table>

            </section>

        </main>

    </div>

<script>
    const API_BASE_URL = "http://localhost:8080/api";

    async function loadFaculty() {
        const tableBody = document.getElementById("facultyTableBody");

        try {
            const response = await fetch(`${API_BASE_URL}/faculty`);

            if (!response.ok) {
                throw new Error("Failed to fetch faculty data");
            }

            const facultyList = await response.json();

            tableBody.innerHTML = "";

            if (facultyList.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6">No faculty members found.</td>
                    </tr>
                `;
                return;
            }

            facultyList.forEach(faculty => {
               const row = document.createElement("tr");
row.dataset.facultyId = faculty.facultyId;

                row.innerHTML = `
                    <td>${faculty.facultyCode ?? faculty.facultyId ?? "-"}</td>
                    <td>${faculty.firstName ?? ""} ${faculty.lastName ?? ""}</td>
                    <td>${faculty.email ?? "-"}</td>
                    <td>${faculty.designation ?? "-"}</td>
                    <td>${faculty.experience != null ? faculty.experience + " Years" : "-"}</td>
                    <td>
                        <button class="edit-btn" type="button">Edit</button>
                        <button class="delete-btn" type="button">Delete</button>
                    </td>
                `;

                tableBody.appendChild(row);
            });

        } catch (error) {
            console.error("Faculty API Error:", error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="6">Unable to load faculty data. Please check the backend.</td>
                </tr>
            `;
        }
    }

    loadFaculty();
  
// Open Add Faculty form
document.getElementById("addFacultyBtn").addEventListener("click", function () {
    document.getElementById("facultyFormSection").style.display = "block";
    document.getElementById("facultyFormSection").scrollIntoView({
        behavior: "smooth"
    });
});

// Close form on Cancel
document.getElementById("cancelFacultyBtn").addEventListener("click", function () {
    document.getElementById("facultyForm").reset();
    document.getElementById("facultyFormSection").style.display = "none";
    document.getElementById("facultyFormMessage").textContent = "";
});
let editingFacultyId = null;
// Save new faculty to the backend
document.getElementById("facultyForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const message = document.getElementById("facultyFormMessage");
    const saveButton = this.querySelector('button[type="submit"]');

    const facultyData = {
        facultyCode: document.getElementById("facultyCode").value.trim(),
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        designation: document.getElementById("designation").value.trim(),
        qualification: document.getElementById("qualification").value.trim(),
        experience: document.getElementById("experience").value === ""
            ? null
            : Number(document.getElementById("experience").value),
        departmentId: Number(document.getElementById("departmentId").value)
    };

    try {
        saveButton.disabled = true;
        message.textContent = "Saving faculty...";

        const url = editingFacultyId === null
    ? `${API_BASE_URL}/faculty`
    : `${API_BASE_URL}/faculty/${editingFacultyId}`;

const method = editingFacultyId === null ? "POST" : "PUT";

const response = await fetch(url, {
    method: method,
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(facultyData)
});
           
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || `Request failed (${response.status})`);
        }

        message.textContent = "Faculty added successfully!";

        this.reset();

        await loadFaculty();

        setTimeout(() => {
            document.getElementById("facultyFormSection").style.display = "none";
            message.textContent = "";
        }, 1200);

    } catch (error) {
        console.error("Add Faculty Error:", error);
        message.textContent =
            "Could not save faculty. Check the department ID, duplicate code/email, and backend.";
    } finally {
        saveButton.disabled = false;
    }
});


// Search faculty by name, code, or email
document.getElementById("facultySearch").addEventListener("input", function () {
    const searchText = this.value.toLowerCase().trim();
    const rows = document.querySelectorAll("#facultyTableBody tr");

    rows.forEach(row => {
        const rowText = row.textContent.toLowerCase();
        row.style.display = rowText.includes(searchText) ? "" : "none";
    });
});

// Delete faculty
document.getElementById("facultyTableBody").addEventListener("click", async function (event) {
    if (!event.target.classList.contains("delete-btn")) {
        return;
    }

    const row = event.target.closest("tr");
    const facultyId = row.dataset.facultyId;

    if (!facultyId) {
        alert("Faculty ID not found!");
        return;
    }

    const confirmed = confirm("Are you sure you want to delete this faculty member?");

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/faculty/${facultyId}`, {
            method: "DELETE"
        });

        if (!response.ok) {
            throw new Error("Delete request failed");
        }

        alert("Faculty deleted successfully!");
        await loadFaculty();

    } catch (error) {
        console.error("Delete Faculty Error:", error);
        alert("Unable to delete faculty. Please check the backend.");
    }
});

// Edit faculty
document.getElementById("facultyTableBody").addEventListener("click", async function (event) {
    if (!event.target.classList.contains("edit-btn")) {
        return;
    }

    const row = event.target.closest("tr");
    const facultyId = row.dataset.facultyId;

    if (!facultyId) {
        alert("Faculty ID not found!");
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/faculty/${facultyId}`);

        if (!response.ok) {
            throw new Error("Unable to fetch faculty details");
        }

        const faculty = await response.json();
        editingFacultyId = faculty.facultyId;

        document.getElementById("facultyFormSection").style.display = "block";
        document.getElementById("facultyFormSection").scrollIntoView({
            behavior: "smooth"
        });

        document.getElementById("facultyCode").value = faculty.facultyCode ?? "";
        document.getElementById("firstName").value = faculty.firstName ?? "";
        document.getElementById("lastName").value = faculty.lastName ?? "";
        document.getElementById("email").value = faculty.email ?? "";
        document.getElementById("phone").value = faculty.phone ?? "";
        document.getElementById("designation").value = faculty.designation ?? "";
        document.getElementById("qualification").value = faculty.qualification ?? "";
        document.getElementById("experience").value = faculty.experience ?? "";
        document.getElementById("departmentId").value = faculty.departmentId ?? "";

        alert("Faculty details loaded. Edit the fields and save.");

    } catch (error) {
        console.error("Edit Faculty Error:", error);
        alert("Unable to load faculty details. Please check the backend.");
    }
});
</script>


</body>

</html>
